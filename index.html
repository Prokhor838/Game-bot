<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GAME BOT 2.0</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#07061a;--bg2:#120b33;--sf:rgba(255,255,255,.07);--bd:rgba(255,255,255,.12);--tx:#f1f0ff;--mu:#9a98c4;--ac:#8b5cf6;--ac2:#22d3ee;--sh:0 10px 30px rgba(0,0,0,.4)}
[data-theme=light]{--bg:#f4f2ff;--bg2:#e4eeff;--sf:rgba(255,255,255,.85);--bd:rgba(80,60,160,.15);--tx:#1c1840;--mu:#6b68a0;--ac:#6d3df0;--ac2:#0891b2;--sh:0 10px 26px rgba(90,70,170,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(120% 60% at 80% -10%,var(--bg2),var(--bg));color:var(--tx);overflow-x:hidden}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-top:env(safe-area-inset-top,0px)}
.sc{padding:10px 14px calc(92px + env(safe-area-inset-bottom,0px));animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}@keyframes pop{from{transform:scale(.6);opacity:0}}@keyframes sp{to{transform:rotate(360deg)}}
.na *{animation:none!important;transition:none!important}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px 0}
.logo{font-weight:900;font-size:17px;letter-spacing:.5px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent;flex:1}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-weight:800;color:#fff}
.bal{padding:6px 12px;border-radius:99px;background:var(--sf);border:1px solid var(--bd);font-weight:800;font-size:17px;box-shadow:0 0 18px rgba(139,92,246,.35)}
.ib,.bk{background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:12px;min-width:40px;height:40px;font-size:16px;cursor:pointer}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:14px;margin:12px 0;box-shadow:var(--sh);backdrop-filter:blur(10px)}
h2{margin:16px 2px 6px;font-size:18px}.mu{color:var(--mu);font-size:13px}
.btn{width:100%;min-height:48px;border:0;border-radius:14px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));cursor:pointer;box-shadow:0 6px 20px rgba(139,92,246,.4);transition:transform .1s}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.45}.btn.g{background:var(--sf);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tl{border:0;border-radius:20px;padding:12px;text-align:left;color:#fff;min-height:150px;background:linear-gradient(145deg,var(--a),var(--b));box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.35);cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .12s;position:relative;overflow:hidden}
.tl:active{transform:scale(.96)}.tl b{font-size:16px}.tl span{font-size:12px;opacity:.85}.gl{position:absolute;right:-6px;top:-2px;width:84px;opacity:.9}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--bd);backdrop-filter:blur(18px);z-index:5}
.nav button{flex:1;max-width:120px;background:none;border:0;color:var(--mu);font-size:12px;font-weight:700;min-height:48px;cursor:pointer}.nav button.on{color:var(--ac2)}.nav i{display:block;font-style:normal;font-size:20px}
.bd{display:grid;gap:8px;width:min(100%,340px);margin:10px auto}.t3{grid-template-columns:repeat(3,1fr)}
.cell{aspect-ratio:1;border-radius:16px;border:1px solid var(--bd);background:var(--sf);font-size:44px;font-weight:900;color:var(--tx);display:grid;place-items:center;cursor:pointer}
.cell.X{color:var(--ac2);text-shadow:0 0 14px var(--ac2)}.cell.O{color:#f472b6;text-shadow:0 0 14px #f472b6}.cell.w{background:rgba(139,92,246,.35);box-shadow:0 0 20px var(--ac)}.cell span{animation:pop .25s}
.reels{display:flex;gap:8px;justify-content:center;margin:12px 0}.rl{width:30%;aspect-ratio:.9;border-radius:18px;background:linear-gradient(#0003,#0000,#0003),var(--sf);border:2px solid var(--ac);display:grid;place-items:center;font-size:48px;box-shadow:0 0 20px rgba(139,92,246,.4)}
.chips{display:flex;gap:8px;margin:8px 0}.chip{flex:1;min-height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-weight:800;cursor:pointer}.chip.on{background:var(--ac);color:#fff}
.big{font-size:42px;font-weight:900;text-align:center;margin:6px 0}.bar{height:10px;border-radius:9px;background:var(--sf);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
input.in{width:100%;min-height:54px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:26px;font-weight:800;text-align:center;margin:8px 0}
.ans{display:block;width:100%;text-align:left;min-height:52px;margin:8px 0;padding:10px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font-size:16px;font-weight:600;cursor:pointer}.ans.ok{background:#16a34a;color:#fff}.ans.no{background:#dc2626;color:#fff}
.q{font-size:21px;font-weight:800;margin:10px 0;min-height:70px}
.uo{display:flex;gap:6px}.uo div{flex:1;text-align:center;padding:8px 4px;border-radius:14px;background:var(--sf);border:1px solid var(--bd);font-size:12px}.uo .on{box-shadow:0 0 0 2px var(--ac2)}
.hand{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;-webkit-overflow-scrolling:touch}
.uc{flex:0 0 auto;width:56px;height:84px;border-radius:12px;border:3px solid #fff;color:#fff;font-weight:900;font-size:20px;background:radial-gradient(ellipse at center,#fff3 0 30%,transparent 31%),var(--c);box-shadow:0 4px 10px #0006;cursor:pointer;animation:pop .25s}.uc.dim{opacity:.4}.uc.lg{width:84px;height:124px;font-size:30px}
.pk{flex:0 0 auto;width:56px;height:82px;border-radius:10px;background:#fff;border:1px solid #ccd;box-shadow:0 3px 8px #0005;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#111;cursor:pointer;line-height:1;padding:0;animation:pop .25s}
.pk b{font-size:24px}.pk span{font-size:30px}.pk.r{color:#dc2626}.pk.dim{opacity:.4}.pk.on{outline:3px solid var(--ac2);transform:translateY(-6px)}
.tb{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:110px;padding:10px 4px}.pr{position:relative;width:76px;height:98px}.pr .pk{position:absolute;left:0;top:0}.pr .pk+.pk{left:18px;top:14px}
.gh2{position:fixed;pointer-events:none;z-index:30;display:grid;opacity:.9}.bx.pv{background:rgba(34,211,238,.6)!important}.bx.bad{background:rgba(244,63,94,.45)!important}.pc{touch-action:none;user-select:none}
.rl2{position:relative;overflow:hidden;margin:12px -6px;padding:10px 0;border-radius:14px;background:rgba(0,0,0,.25);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.st2{display:flex;will-change:transform;animation:mb 5.2s ease-out both}@keyframes mb{0%{filter:blur(2.5px)}40%{filter:blur(1.5px)}100%{filter:blur(0)}}
.ptr{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fbbf24;box-shadow:0 0 14px 2px #fbbf24;z-index:2}
.tl2{flex:none;width:92px;height:116px;margin-right:6px;border-radius:12px;border:2px solid var(--rc);background:rgba(255,255,255,.07);box-shadow:inset 0 -28px 24px -20px var(--rc);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;text-align:center;padding:4px;color:var(--tx)}.tl2 svg{width:50px}.tl2 .em{font-size:36px;line-height:50px}.tl2 span{margin-top:4px;line-height:1.1}
@keyframes rv{from{transform:scale(.8);opacity:0}}
.ct{border-radius:20px;padding:14px;margin:12px 0;color:#fff;border:1px solid rgba(255,255,255,.25);box-shadow:var(--sh)}.ct .od{font-size:12px;opacity:.95;margin:8px 0}.ct .od div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.rw{display:flex;gap:10px;align-items:center}.ico{width:54px;height:54px;flex:none}
.it{display:flex;flex-direction:column;align-items:center;text-align:center;border-radius:16px;padding:10px 6px;background:var(--sf);border:2px solid var(--rc);font-size:12px}.it svg{width:52px}
.mo{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.md{background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:22px;padding:18px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;z-index:20;animation:in .2s;max-width:90%}
.bx{aspect-ratio:1;border-radius:6px;background:var(--sf);border:1px solid var(--bd)}.bx.f{border-color:#fff4;animation:pop .2s}
.pc{display:grid;gap:2px;padding:8px;border-radius:12px;border:2px solid transparent;background:var(--sf);cursor:pointer;min-width:60px;justify-items:center}.pc.on{border-color:var(--ac2)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
</style></head><body><div id="app"></div><div id="mo" class="mo" onclick="if(event.target==this)modal()"></div>
<script>
const $=s=>document.querySelector(s),shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const D={v:1,coins:500,theme:matchMedia('(prefers-color-scheme: light)').matches?'light':'dark',anim:true,daily:'',st:{g:0,w:0,l:0,lines:0,best:0,quiz:0,cases:0},col:{},ach:{}};
function load(){try{const r=JSON.parse(localStorage.getItem('gb2'));if(r&&r.v===1&&Number.isFinite(r.coins)&&r.coins>=0)return{...D,...r,st:{...D.st,...r.st},col:r.col||{},ach:r.ach||{}}}catch(e){}return JSON.parse(JSON.stringify(D))}
let S=load(),tab='home',game=null,G={},busy=false,tok=0,F={r:-1,s:'r'};
function save(){try{localStorage.setItem('gb2',JSON.stringify(S))}catch(e){}}
const E={add(n){S.coins+=Math.max(0,Math.floor(n));save()},spend(n){if(!(n>0)||n>S.coins){toast('Недостаточно монет');return false}S.coins-=n;save();return true}};
const tg=window.Telegram&&Telegram.WebApp,TU=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,NAME=TU&&TU.first_name||'Игрок';
if(tg){try{tg.ready();tg.expand()}catch(e){}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function modal(h){const m=$('#mo');m.innerHTML=h?`<div class=md>${h}</div>`:'';m.style.display=h?'flex':'none'}
function rec(w){S.st.g++;if(w==1)S.st.w++;if(w==-1)S.st.l++;save();ach()}
const RAR=['Обычный','Необычный','Редкий','Эпический','Легендарный'],RC=['#8a96b0','#34d399','#38bdf8','#a78bfa','#fbbf24'];
const ITEMS=[['Дымчатый кварц','Мутный камень из старых шахт',0,20,'#94a3b8'],['Янтарная друза','Хранит тепло рассвета',0,35,'#f59e0b'],['Изумрудный осколок','Зелёный свет глубин',1,60,'#10b981'],['Топаз ветров','Звенит на сквозняке',1,90,'#fb923c'],['Сапфировая призма','Холодное синее сияние',2,150,'#3b82f6'],['Рубиновое сердце','Пульсирует алым',2,220,'#ef4444'],['Аметист бури','Грозовая фиолетовая грань',3,400,'#a855f7'],['Бирюзовый Рассвет','Светится в темноте',3,550,'#14b8a6'],['Звёздный алмаз','Родился в туманности',4,1200,'#e0f2fe'],['Кристалл вечности','Меняет цвет с каждым взглядом',4,2000,'#f472b6'],
['Энергетический жетон','Заряжен неоновой энергией',1,250,'#22d3ee','⚡'],['Неоновый скин','Светящийся скин для вашего профиля',2,1500,'#38bdf8','🎨'],['Теневой клинок','Рассекает свет и тишину',3,2500,'#8b5cf6','🗡️'],['Маска призрака','Скрывает владельца от чужих глаз',3,3500,'#a78bfa','👻'],
['Огненный след','Оставляет пламя за каждым шагом',3,6000,'#f97316','🔥'],['Корона пламени','Венец из живого огня',4,12000,'#ef4444','👑'],['Космическая аура','Мерцающее сияние далёких звёзд',4,15000,'#c084fc','🌌'],['Золотой дракон','Ультраредкий хранитель сокровищ',4,80000,'#f5c542','🐉'],
['Эфирный амулет','Эксклюзив магазина кристаллов',2,120,'#a78bfa','🔮'],['Лунный клинок','Эксклюзив магазина кристаллов',3,300,'#93c5fd','🌙'],['Хрустальное крыло','Эксклюзив магазина кристаллов',3,450,'#67e8f9','🦋'],['Печать бездны','Эксклюзив магазина кристаллов',4,1000,'#818cf8','🌀']];
const icon=i=>{if(ITEMS[i][5])return uicon(i);const c=ITEMS[i][4],v=i%3,p=v==0?'20,2 33,14 28,38 12,38 7,14':v==1?'20,2 36,20 20,38 4,20':'12,4 28,4 36,18 20,38 4,18',q=p.split(' ');return`<svg viewBox="0 0 40 40" style="filter:drop-shadow(0 0 6px ${c})"><defs><linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".6"/></linearGradient></defs><polygon points="${p}" fill="url(#g${i})" stroke="#fff" stroke-opacity=".7"/><polygon points="${q[0]} 20,20 ${q[1]}" fill="#fff" opacity=".35"/><circle cx="14" cy="12" r="2" fill="#fff" opacity=".8"/></svg>`};
const AC=[['Первая партия',()=>S.st.g>=1],['Первая победа',()=>S.st.w>=1],['Первый кейс',()=>S.st.cases>=1],['10 партий',()=>S.st.g>=10],['100 линий в «Блоках»',()=>S.st.lines>=100],['Викторина завершена',()=>S.st.quiz>=1],['Редкий предмет',()=>Object.keys(S.col).some(k=>ITEMS[k][2]>=2)],['Легендарный предмет',()=>Object.keys(S.col).some(k=>ITEMS[k][2]==4)]];
function ach(){AC.forEach((a,i)=>{if(!S.ach[i]&&a[1]()){S.ach[i]=1;E.add(50);toast('Достижение: '+a[0]+' +50')}})}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function left(){const n=new Date(),s=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n)/1000);return Math.floor(s/3600)+' ч '+Math.floor(s%3600/60)+' мин'}
function claim(){if(S.daily===today())return;S.daily=today();E.add(100);toast('+100 монет');render()}
// ---------- Games ----------
const WL=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],win=b=>WL.find(l=>b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]]);
const T={init(){G={b:Array(9).fill(''),end:0,line:[]}},
tap(i){if(G.end||G.b[i])return;G.b[i]='X';if(!T.fin()){T.bot();T.fin()}render()},
bot(){const b=G.b,e=b.map((v,i)=>v?-1:i).filter(i=>i>=0),f=p=>e.find(i=>{b[i]=p;const w=win(b);b[i]='';return w});let m=f('O');if(m==null)m=f('X');if(m==null&&!b[4])m=4;if(m==null){const c=e.filter(i=>[0,2,6,8].includes(i)),a=c.length?c:e;m=a[Math.random()*a.length|0]}b[m]='O'},
fin(){const l=win(G.b);if(l){G.line=l;G.end=G.b[l[0]]=='X'?1:2}else if(G.b.every(x=>x))G.end=3;if(!G.end)return 0;if(G.end==1){E.add(20);rec(1)}else if(G.end==2)rec(-1);else{E.add(5);rec(0)}return 1},
view(){return bar('Крестики-нолики')+`<div class="bd t3">${G.b.map((v,i)=>`<button class="cell ${v} ${G.line.includes(i)?'w':''}" onclick="T.tap(${i})"><span>${v=='X'?'✕':v=='O'?'◯':''}</span></button>`).join('')}</div>`+(G.end?`<div class=card><div class=big>${['','Победа! +20','Поражение','Ничья +5'][G.end]}</div><button class=btn onclick="openG('ttt')">Играть снова</button><br><br><button class="btn g" onclick="exitG()">В меню</button></div>`:'<p class="mu" style="text-align:center">Ваш ход (✕). Победа +20, ничья +5</p>')}};
const SY=['🍒','🍋','🔔','💎','7️⃣'],SW=[5,4,3,2,1],SM=[4,6,10,20,50];let spinning=false;
const Z={init(){G={bet:10,r:[0,1,2],hist:[],msg:'Три одинаковых — множитель, две — возврат ставки'}},
go(){if(spinning)return;const bet=G.bet,g=G;if(!E.spend(bet))return;spinning=true;
const res=[0,0,0].map(()=>{let x=Math.random()*15;for(let i=0;i<5;i++)if((x-=SW[i])<0)return i;return 0});
let pay=0;if(res[0]==res[1]&&res[1]==res[2])pay=bet*SM[res[0]];else if(res[0]==res[1]||res[1]==res[2]||res[0]==res[2])pay=bet;
const t=setInterval(()=>{g.r=g.r.map(()=>Math.random()*5|0);if(game=='slots')render()},90);
setTimeout(()=>{clearInterval(t);E.add(pay);g.r=res;spinning=false;g.msg=pay>bet?`Выигрыш +${pay-bet}!`:pay==bet?'Ставка возвращена':'Не повезло';g.hist.unshift(pay-bet);g.hist=g.hist.slice(0,8);rec(pay>bet?1:pay==bet?0:-1);if(game=='slots')render()},1100)},
view(){return bar('Мини казино')+`<div class=card><div class=reels>${G.r.map(i=>`<div class=rl>${SY[i]}</div>`).join('')}</div><div class=big>${G.msg}</div><div class=chips>${[10,50,100].map(b=>`<button class="chip ${G.bet==b?'on':''}" onclick="if(!spinning){G.bet=${b};render()}">${b}</button>`).join('')}</div><button class=btn ${spinning?'disabled':''} onclick="Z.go()">Крутить за ${G.bet}</button></div><div class=card><b>Выплаты</b><div class=mu>${SY.map((s,i)=>s+s+s+' ×'+SM[i]).join(' · ')}<br>Любая пара — возврат ставки</div><p class=mu>Последние: ${G.hist.map(h=>h>0?'+'+h:h).join(', ')||'—'}</p></div>`}};
const LV=[['Лёгкий',50,7,30],['Средний',100,8,60],['Сложный',500,10,150]];
const N={init(){G={l:null}},start(l){G={l,n:1+Math.random()*LV[l][1]|0,t:0,hint:'Введите число',over:0,hist:[]};render()},

games(){return`<h2 style="margin-top:6px">Игры</h2><div class=grid>${GM.map(tile).join('')}</div>`},
col(){let ks=Object.keys(S.col).map(Number);const tot=ks.length;ks=ks.filter(k=>F.r<0||ITEMS[k][2]==F.r).sort((a,b)=>F.s=='r'?ITEMS[b][2]-ITEMS[a][2]:F.s=='n'?ITEMS[a][0].localeCompare(ITEMS[b][0]):S.col[b]-S.col[a]);
return`<h2 style="margin-top:6px">Коллекция · ${tot} из ${ITEMS.length}</h2><p class=mu>Нажмите на кристалл, чтобы вывести его в монеты</p><div class=chips><button class="chip ${F.r<0?'on':''}" onclick="F.r=-1;render()">Все</button>${RAR.map((r,i)=>`<button class="chip ${F.r==i?'on':''}" style="color:${F.r==i?'#fff':RC[i]}" onclick="F.r=${i};render()">●</button>`).join('')}</div><div class=chips>${[['r','Редкость'],['n','Имя'],['c','Кол-во']].map(s=>`<button class="chip ${F.s==s[0]?'on':''}" onclick="F.s='${s[0]}';render()">${s[1]}</button>`).join('')}</div>`+(ks.length?`<div class=grid style="grid-template-columns:repeat(3,1fr)">${ks.map(items).join('')}</div>`:`<div class=card style="text-align:center"><div class=big>📦</div><p class=mu>${tot?'Нет предметов с таким фильтром':'Здесь пока пусто. Откройте кейс в разделе «Игры».'}</p></div>`)},
prof(){return`<div class=card style="text-align:center"><div class=av style="width:70px;height:70px;font-size:30px;margin:auto">${NAME[0]}</div><h2>${NAME}</h2><div class=mu>${TU?'Профиль Telegram':'Локальный профиль (вне Telegram)'}</div><div class=big>${S.coins} монет</div></div><div class=card>${[['Сыграно партий',S.st.g],['Победы',S.st.w],['Поражения',S.st.l],['Лучший счёт в «Блоках»',S.st.best],['Предметов в коллекции',Object.values(S.col).reduce((a,b)=>a+b,0)],['Очищено линий',S.st.lines]].map(r=>`<div class=sw><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div><h2>Достижения (+50 монет каждое)</h2>${AC.map((a,i)=>`<div class=card style="margin:6px 0;opacity:${S.ach[i]?1:.5}">${S.ach[i]?'✔':'🔒'} ${a[0]}</div>`).join('')}`},
set(){return`<h2 style="margin-top:6px">Настройки</h2><div class=card><div class=sw><span>Светлая тема</span><button class=chip style="flex:none;width:80px" onclick="S.theme=S.theme=='dark'?'light':'dark';save();render()">${S.theme=='dark'?'Выкл':'Вкл'}</button></div><div class=sw><span>Анимации</span><button class=chip style="flex:none;width:80px" onclick="S.anim=!S.anim;save();render()">${S.anim?'Вкл':'Выкл'}</button></div><div class=sw><span>Правила игр</span><button class=chip style="flex:none;width:80px" onclick="rulesAll()">Открыть</button></div><div class=sw><span>Версия</span><b>2.0.0 (сохранения v1)</b></div></div><p class=mu>Данные хранятся только на этом устройстве и не синхронизируются между устройствами. Локальный баланс не защищён от подделки.</p><button class="btn g" onclick="modal('<h3>Сбросить прогресс?</h3><p>Монеты, коллекция, статистика и достижения будут удалены безвозвратно.</p><button class=btn onclick=reset()>Да, сбросить</button><br><br><button class=\'btn g\' onclick=modal()>Отмена</button>')">Сбросить прогресс</button>`}};
const items=k=>`<div class=it onclick="sellAsk(${k})" style="--rc:${RC[ITEMS[k][2]]};cursor:pointer">${icon(k)}<b>${ITEMS[k][0]}</b><span style="color:${RC[ITEMS[k][2]]}">${RAR[ITEMS[k][2]]}</span><span>Стоимость: ${ITEMS[k][3]}</span>${S.col[k]?'<span>×'+S.col[k]+'</span>':''}</div>`;
function sellAsk(k){if(!S.col[k])return;const it=ITEMS[k];modal(`<div style="width:90px;margin:auto">${icon(k)}</div><h3 style="text-align:center">${it[0]}</h3><p class=mu style="text-align:center">${RAR[it[2]]} · у вас ×${S.col[k]}<br>${it[1]}</p><div class=big style="font-size:22px;color:#fbbf24">Стоимость: ${it[3]} монет</div><button class=btn onclick="sellDo(${k})">Вывести 1 шт. за ${it[3]}</button><br><br><button class="btn g" onclick="modal()">Отмена</button>`)}
function sellDo(k){if(!S.col[k]){modal();return}const v=ITEMS[k][3];S.col[k]--;if(!S.col[k])delete S.col[k];E.add(v);modal();toast('+'+v+' монет');render()}
function rulesAll(){modal('<h3>Правила игр</h3>'+GM.map(g=>`<p><b>${g[1]}</b><br><span class=mu>${g[7]}</span></p>`).join('')+'<button class=btn onclick=modal()>Закрыть</button>')}
function reset(){try{localStorage.removeItem('gb2a')}catch(e){}aOK=false;const t=S.theme;S=JSON.parse(JSON.stringify(D));S.theme=t;save();modal();toast('Прогресс сброшен');render()}
function render(){document.documentElement.dataset.theme=S.theme;document.body.classList.toggle('na',!S.anim);
const h=game?gm(game)[3].view():SCR[tab]();
$('#app').innerHTML=`<div class=top><div class=logo onclick="adminTap()">GAME BOT 2.0</div><div class=av>${NAME[0]}</div><div class=bal>🪙 ${S.coins}</div><button class=ib onclick="game=null;tab='set';render()">⚙</button></div><main class=sc>${h}</main><nav class=nav>${[['home','⌂','Главная'],['games','🎮','Игры'],['col','◈','Коллекция'],['shop','💎','Магазин'],['prof','☺','Профиль']].map(n=>`<button class="${!game&&tab==n[0]?'on':''}" onclick="tok++;game=null;tab='${n[0]}';render()"><i>${n[1]}</i>${n[2]}</button>`).join('')}</nav>`}
// ---------- Скрытая локальная админ-панель (только этот профиль на этом устройстве) ----------
const ADMIN_TG_IDS=[]; // Вставьте свой числовой Telegram ID, например [123456789]. Пусто = проверка ID выключена.
let aT=0,aC=0,aOK=false,aFail=0,aLock=0;
const lsg=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const hex=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function adminTap(){const n=Date.now();aC=n-aT>2000?1:aC+1;aT=n;if(aC>=7){aC=0;adminOpen()}}
function adminOpen(){if(ADMIN_TG_IDS.length&&!(TU&&ADMIN_TG_IDS.includes(TU.id)))return;if(!(window.crypto&&crypto.subtle)){toast('Нужен HTTPS');return}
if(aOK){tab='admin';game=null;render();return}if(Date.now()<aLock){toast('Подождите минуту');return}const has=lsg('gb2a');
modal(`<h3>${has?'Вход в админ-панель':'Создайте PIN (4–8 цифр)'}</h3><input id=ap class=in type=password inputmode=numeric maxlength=8 placeholder="PIN">${has?'':'<input id=ap2 class=in type=password inputmode=numeric maxlength=8 placeholder="Повторите PIN">'}<button class=btn onclick="adminPin()">OK</button><br><br><button class="btn g" onclick="modal()">Отмена</button>`)}
async function adminPin(){const p=$('#ap').value,has=lsg('gb2a');if(Date.now()<aLock){toast('Подождите минуту');return}if(!/^\d{4,8}$/.test(p)){toast('PIN: 4–8 цифр');return}
if(!has){if(p!==$('#ap2').value){toast('PIN не совпадает');return}try{localStorage.setItem('gb2a',await hex('gb2|'+p))}catch(e){toast('Не удалось сохранить PIN');return}aOK=true;modal();tab='admin';game=null;render();return}
if(await hex('gb2|'+p)===has){aOK=true;aFail=0;modal();tab='admin';game=null;render()}else{aFail++;if(aFail>=5){aFail=0;aLock=Date.now()+60000;modal();toast('Слишком много попыток: подождите минуту')}else toast('Неверный PIN')}}
function adC(op){if(!aOK)return;const v=Number($('#ac').value);if(!Number.isInteger(v)||v<0||v>1e9){toast('Введите целое число от 0 до 1 000 000 000');return}
const r=op=='set'?v:op=='add'?S.coins+v:S.coins-v;if(r<0){toast('Баланс не может быть отрицательным');return}if(r>1e9){toast('Слишком большой баланс');return}S.coins=r;save();toast('Баланс: '+r);render()}
function adK(i,d){if(!aOK)return;const q=(S.col[i]||0)+d;if(q<0){toast('Нечего забирать');return}adQ(i,Math.min(q,9999))}
function adQ(i,q){if(q<=0)delete S.col[i];else S.col[i]=q;save();render()}
function adS(){if(!aOK)return;const q=Number($('#ak').value);if(!Number.isInteger(q)||q<0||q>9999){toast('Введите целое число от 0 до 9999');return}adQ(+$('#as').value,q);toast('Количество задано')}
SCR.admin=()=>{if(!aOK)return'<p class=mu>Нет доступа</p>';return`<div class=gh><button class=bk onclick="aOK=false;tab='set';render()">‹ Выйти</button><b>Админ-панель</b><span style=width:40px></span></div><p class=mu>Меняет только локальный профиль на этом устройстве.</p>
<div class=card><b>Монеты</b><div class=big>${S.coins}</div><input id=ac class=in inputmode=numeric placeholder="Сумма"><div class=chips><button class="chip on" onclick="adC('set')">Установить</button><button class=chip onclick="adC('add')">+ Добавить</button><button class=chip onclick="adC('sub')">− Забрать</button></div></div>
<div class=card><b>Кристаллы</b>${ITEMS.map((x,i)=>`<div class=sw><span style="color:${RC[x[2]]}">${x[0]}<br><span class=mu>${RAR[x[2]]} · ×${S.col[i]||0}</span></span><span style="display:flex;gap:6px"><button class=chip style="width:44px" onclick="adK(${i},-1)">−</button><button class=chip style="width:44px" onclick="adK(${i},1)">+</button><button class=chip style="width:56px" onclick="adK(${i},10)">+10</button></span></div>`).join('')}
<p class=mu style="margin-top:12px">Задать точное количество:</p><select id=as class=in style="font-size:16px;min-height:44px">${ITEMS.map((x,i)=>`<option value=${i}>${x[0]} (${RAR[x[2]]})</option>`).join('')}</select><input id=ak class=in inputmode=numeric placeholder="Количество"><button class=btn onclick="adS()">Задать</button></div>`};
// ---------- Магазин кристаллов ----------
// Баланс кристаллов = число кристаллов из кейсов (ID 0–9) в коллекции. Оплата списывает самые дешёвые первыми, заранее показывая список.
const SHOP=[{id:18,c:12},{id:19,c:30},{id:20,c:45},{id:21,c:100}];
const gems=()=>Object.keys(S.col).reduce((a,k)=>+k<10?a+(S.col[k]||0):a,0);
function gemPlan(n){let need=n;const p={};Object.keys(S.col).map(Number).filter(k=>k<10&&S.col[k]>0).sort((x,y)=>ITEMS[x][3]-ITEMS[y][3]||x-y).forEach(k=>{if(!need)return;const t=Math.min(need,S.col[k]);p[k]=t;need-=t});return need?null:p}
function gemPay(n){if(!Number.isInteger(n)||n<1)return null;const p=gemPlan(n);if(!p)return null;for(const k in p){S.col[k]-=p[k];if(S.col[k]<=0)delete S.col[k]}save();return p}
function shopAsk(kind,i){const cost=kind=='i'?SHOP[i].c:CS2[i].cost,n=gems();if(kind=='c'&&busy){toast('Дождитесь окончания открытия');return}
if(n<cost){toast('Недостаточно кристаллов: нужно '+cost+', у вас '+n);return}const p=gemPlan(cost);
modal(`<h3>Купить: ${kind=='i'?ITEMS[SHOP[i].id][0]:CS2[i].n}?</h3><p>Цена: 💎 ${cost}</p><p class=mu>Будет списано: ${Object.entries(p).map(([k,q])=>ITEMS[k][0]+' ×'+q).join(', ')}</p><button class=btn onclick="shopDo('${kind}',${i})">Подтвердить</button><br><br><button class="btn g" onclick="modal()">Отмена</button>`)}
function shopDo(kind,i){modal();if(kind=='i'){const x=SHOP[i];if(!gemPay(x.c)){toast('Недостаточно кристаллов');return}S.col[x.id]=(S.col[x.id]||0)+1;save();ach();toast('Куплено: '+ITEMS[x.id][0]);render()}
else{if(busy){toast('Дождитесь окончания открытия');return}if(gems()<CS2[i].cost){toast('Недостаточно кристаллов');return}openG('cases');K.open2(i)}}
SCR.shop=()=>{const n=gems();return`<h2 style="margin-top:6px">Магазин кристаллов</h2><div class=card style="text-align:center"><div class=mu>Баланс кристаллов</div><div class=big>💎 ${n}</div><p class=mu>Считаются все кристаллы из кейсов в вашей коллекции. При покупке сначала списываются самые дешёвые, список показывается до подтверждения.</p></div>
<h2>Эксклюзивные предметы</h2>${SHOP.map((x,i)=>{const it=ITEMS[x.id],ok=n>=x.c;return`<div class=card style="border-color:${RC[it[2]]}"><div class=rw><div class=ico>${icon(x.id)}</div><div><b>${it[0]}</b><div style="color:${RC[it[2]]};font-size:12px;font-weight:700">${RAR[it[2]]}</div><div class=mu>${it[1]} · в коллекции ×${S.col[x.id]||0}</div></div></div><div class=big style="font-size:22px">💎 ${x.c}</div><button class="btn ${ok?'':'g'}" onclick="shopAsk('i',${i})">${ok?'Купить':'Не хватает '+(x.c-n)+' 💎'}</button></div>`}).join('')}
<h2>Специальные кейсы</h2>${CS2.map((c,j)=>!c.gem?'':`<div class=ct style="background:linear-gradient(140deg,${c.c1}cc,${c.c2})"><div class=rw><div style="flex:none">${cart(j,0)}</div><div><b style="font-size:19px">${c.n}</b><div style="font-size:15px">Стоимость: <b>💎 ${c.cost}</b></div></div></div><div class=od>${c.o.map(o=>`<div><span>${olb(o)}</span><b>${pc(o.p)}%</b></div>`).join('')}</div><button class=btn onclick="shopAsk('c',${j})" style="background:rgba(0,0,0,.45);box-shadow:none;border:1px solid rgba(255,255,255,.4)">${n>=c.cost?'Открыть за 💎 '+c.cost:'Не хватает '+(c.cost-n)+' 💎'}</button></div>`).join('')}`};
{const _r=render;render=function(){_r();if(game=='cases'&&G.ph=='roll')K.mount()}}
render();
</script></body></html>
