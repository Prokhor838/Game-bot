ov.innerHTML=`${ps}<div class=lvbox><div class=lvt>НОВЫЙ УРОВЕНЬ!</div><div class=lvn>${to}</div>${to-from>1?`<div style="color:#cbd5e1;font-size:13px">Уровни ${from+1}–${to}</div>`:''}<div class=lvr>${coins?`<div>+${fmt(coins)} 🪙</div>`:''}${nt.map(t=>`<div><span class="tt tt${t.r}">${xe(t.n)}</span> <small>${TR[t.r]}</small></div>`).join('')}${nc.map(c=>`<div>🎁 ${xe(c.n)}</div>`).join('')}</div><button class=btn onclick="document.getElementById('lvfx').remove()">Продолжить</button></div>`;
document.body.append(ov);SFX.play('lvl')}
function gainXP(n,quiet){n=Math.floor(n);if(!(n>0))return;const a=lvOf(S.xp);S.xp+=n;const b=lvOf(S.xp);let coins=0;for(let l=a+1;l<=b;l++){if(S.lvR[l])continue;S.lvR[l]=1;coins+=CFG.rew[l]!==undefined?CFG.rew[l]:CFG.rewDef(l)}
if(coins)E.add(coins);else save();const p=progress(true);if(!quiet)toast('+'+n+' XP');if(b>a)lvlUp(a,b,coins,p.nt,p.nc);else if(p.nt.length||p.nc.length)banners(p.nt,p.nc)}
function xpFor(g,w,i){const X=CFG.xp[g];if(!X)return 0;i=i||{};let x=X.p;if(g=='ttt')x+=w==1?X.w:w==0?X.d:0;else if(g=='durak'||g=='ball')x+=w==1?Math.round(X.w*(g=='ball'?X.m[i.lv==null?1:i.lv]:1)):0;
else if(g=='quiz')x+=X.c*Math.min(10,Math.max(0,i.ok|0))+(w==1?X.w:0);else if(g=='blocks')x+=Math.min(X.cap,Math.floor(Math.max(0,i.score|0)/X.per));else if(g=='cases'){const r=Math.max(0,Math.min(5,(i.rw&&i.rw.r)|0));x+=X.r[r]}return x}

const dayKey=()=>new Date().toISOString().slice(0,10);

let x=[...d].reduce((a,ch)=>(a*31+ch.charCodeAt(0))>>>0,7)||1;const rnd=()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296},tasks=[];

S.dq={day:d,tasks,c:{g:0,w:0,games:{},cases:0,cry:0,qc:0,bmax:0}};const lim=new Date(Date.now()-14*864e5).toISOString().slice(0,10);for(const k in S.dqHist)if(k.slice(0,10)<lim)delete S.dqHist[k];save()}

function dqScore(v){dqEnsure();if(v>S.dq.c.bmax)S.dq.c.bmax=v}
function quizOk(){dqEnsure();S.dq.c.qc++;S.st.qc++;save()}
function dqClaim(id){dqEnsure();const t=S.dq.tasks.find(x=>x.id===id),q=DQT.pool.find(x=>x[0]===id);if(!t||!q)return;const hk=S.dq.day+':'+id;if(t.claimed||S.dqHist[hk]===1)return;if(dqVal(q[4])<q[5]){toast('Задание ещё не выполнено');return}
t.claimed=true;S.dqHist[hk]=1;S.dqDone++;E.add(q[7]);gainXP(q[6],true);toast('Задание выполнено: +'+q[6]+' XP, +'+fmt(q[7])+' монет');SFX.play('coin');render()}

<div class=xpb style="margin-top:8px"><i data-w="${Math.round(v/q[5]*100)}" style="width:0%"></i></div><div class=rw style="margin-top:6px"><span class=mu style="flex:1">${v} / ${q[5]}</span>${t.claimed?'<span class=mu>Получено</span>':ok?`<button class=btn style="width:auto;min-height:38px;padding:0 18px" onclick="dqClaim('${t.id}')">Забрать</button>`:'<span class=mu>В процессе</span>'}</div></div>`}).join('')}
Object.assign(SFX.S,{lvl:[4,1.4,()=>{SFX.arp([392,523,659,784,1047],.09,'triangle',.15);SFX.t(1568,.6,'sine',.1,.5)}]});
loginTick();dqEnsure();progress(true);fixSel();
// ---------- Авто-вывод предметов ----------
// S.auto = {on, limit}. Продаются только ТОЛЬКО ЧТО полученные из кейса экземпляры (K.claim), цена берётся из ITEMS[id][3] (та же, что при ручной продаже).
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function pl(n){return n%10==1&&n%100!=11?'предмет':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'предмета':'предметов'}
function autoCfg(){const a=S.auto&&typeof S.auto==='object'?S.auto:{},lim=Number.isInteger(a.limit)&&a.limit>=0&&a.limit<=1e9?a.limit:null;return{raw:a.on===true,limit:lim,on:a.on===true&&lim!==null}}
function autoSell(rw){rw.auto=null;const c=autoCfg();if(!c.on||!rw)return null;const units=rw.t=='i'?{[rw.id]:1}:rw.t=='k'?rw.m:null;if(!units)return null;let n=0,coins=0;const list=[];
for(const id in units){const k=+id,q=units[id],it=ITEMS[k],p=it&&it[3];if(!Number.isInteger(p)||p<=0||p>c.limit||!Number.isInteger(q)||q<=0)continue;const have=S.col[k]||0,t=Math.min(q,have);if(t<=0)continue;
S.col[k]=have-t;if(S.col[k]<=0)delete S.col[k];n+=t;coins+=p*t;list.push([k,t,p*t])}
if(!n)return null;E.add(coins);rw.auto={n,coins,list};toast(n==1?'Авто-вывод: предмет продан за '+fmt(coins)+' монет':'Авто-вывод завершён: продано '+n+' '+pl(n)+', получено '+fmt(coins)+' монет');return rw.auto}
function autoCard(){const c=autoCfg(),st=c.on?'Авто-вывод включён: новые предметы из кейсов стоимостью до лимита продаются сами.':c.limit===null?'Лимит не задан: авто-вывод не работает.':'Авто-вывод выключен: предметы остаются в коллекции.';
return`<div class=card id=autoCard><b>Авто-вывод предметов</b><div class=sw><span>Авто-вывод</span><button class="chip ${c.on?'on':''}" style="flex:none;width:84px" onclick="autoToggle()">${c.on?'ВКЛ':'ВЫКЛ'}</button></div><div class=sw><span>Текущий лимит</span><b>${c.limit===null?'не задан':fmt(c.limit)+' монет'}</b></div>
<p class=mu style="margin:10px 0 4px">Максимальная стоимость предмета (в монетах)</p><input id=al class=in inputmode=numeric placeholder="Например, 100000" value="${c.limit===null?'':c.limit}" onkeydown="if(event.key==='Enter'&&!event.repeat){event.preventDefault();autoSave(0)}">
<div class=chips>${[1000,10000,100000,1000000].map(v=>`<button class=chip onclick="$('#al').value=${v}">${fmt(v)}</button>`).join('')}</div><button class=btn onclick="autoSave(0)">Сохранить</button>
<p class=mu>Предметы стоимостью до указанной суммы будут автоматически обмениваться на монеты. ${st} Кристаллы тоже продаются, а они нужны для магазина.</p></div>`}
function autoAsk(){const i=$('#al');if(i&&i.focus)i.focus()}
function autoSave(en){const el=$('#al'),v=String(el&&el.value||'').replace(/[\s\u00a0\u202f]/g,'');if(!/^\d{1,10}$/.test(v)||Number(v)>1e9){toast('Введите целое число от 0 до 1 000 000 000');return}
const old=S.auto&&typeof S.auto==='object'?S.auto:{};S.auto={on:en?true:old.on===true,limit:Number(v)};save();toast('Лимит авто-вывода: '+fmt(Number(v))+' монет');render()}
function autoToggle(){const c=autoCfg();if(c.raw){S.auto={on:false,limit:c.limit};save();render();return}
if(c.limit===null){const el=$('#al'),v=String(el&&el.value||'').replace(/[\s\u00a0\u202f]/g,'');if(/^\d{1,10}$/.test(v)&&Number(v)<=1e9){S.auto={on:true,limit:Number(v)};save();toast('Авто-вывод включён, лимит '+fmt(Number(v))+' монет');render();return}toast('Сначала введите лимит и нажмите «Сохранить»');autoAsk();return}
S.auto={on:true,limit:c.limit};save();render()}
// Настройки: поверх текущего экрана или игры; состояние игры не трогаем, повторное нажатие закрывает
function toggleSet(){if(setOpen){setOpen=false}else if(!game&&tab=='set'){tab='home'}else{setOpen=true}render()}
function sndToggle(){S.snd=S.snd===false;save();render();if(S.snd!==false){SFX.unlock();SFX.play('ok')}}
function sfxClick(e){SFX.unlock();const t=e.target;if(!t||!t.closest)return;const b=t.closest('button');if(!b)return;const k=' '+(b.className||'')+' ';
SFX.play(b.closest('.nav')?'nav':/ tl /.test(k)?'tile':/ bk /.test(k)?'back':/ (btn|chip|ib) /.test(k)?'tap':'')}
addEventListener('pointerdown',sfxClick,true);addEventListener('touchend',()=>SFX.unlock(),true);
// Звуки действий в «Дураке» (атака, защита, взятие, пас, перевод) — оборачиваем существующие методы
[['add','card'],['defend','def'],['take','draw_'],['pass','pass'],['xfer','xfer']].forEach(([m,n])=>{const f=DU[m];DU[m]=function(...a){SFX.play(n);return f.apply(this,a)}});
// Окна и уведомления
{const _m=modal;modal=function(h){const was=$('#mo').style.display=='flex';_m(h);if(h&&!was)SFX.play('open');else if(!h&&was)SFX.play('close')};
const _t=toast;toast=function(m){_t(m);const x=String(m);SFX.play(/Достижени/.test(x)?'ach':/Недостаточно|нельзя|Нельзя|Введите|Неверн|помест|Ошибка|Не хватает|Дождитесь|Слишком|Нечего|PIN|не бьёт|Нужен/.test(x)?'err':/^\+\d/.test(x)?'coin':/Куплено|Награда|Баланс|Количество|Импорт|Прогресс/.test(x)?'ok':'note')}}
if(S.pend){K.claim();setTimeout(()=>toast('Награда из прерванного открытия начислена'),300)}
{const _r=render;render=function(){_r();requestAnimationFrame(()=>{document.querySelectorAll('.xpb i').forEach(i=>{i.style.width=(i.getAttribute('data-w')||0)+'%'})});if(game=='cases'&&G.ph=='roll')K.mount();if(game=='ball')PG.mount()}}
render();
