// UPGRADER

// Настройки формулы: шанс = стоимость ставки / стоимость цели × K, не выше MAX и никогда не 100%.
const UPC={K:1,MAX:.95,MIN:.0001,calc(tot,val){if(!(tot>0)||!(val>0))return 0;return Math.max(0,Math.min(UPC.MAX,Math.floor(tot/val*UPC.K*10000+1e-9)/10000))}};
const SRTL=[['a','Сначала дешёвые'],['d','Сначала дорогие']];
const UP={lock:false,
 init(){UP.shut();G={sel:{},dr:null,tgt:null,pk:'',q:{b:'',t:''},fr:{b:-1,t:-1},so:{b:'a',t:'a'},ph:null,rot:0,res:null,hall:0}},
 total(){return Object.keys(G.sel).reduce((a,k)=>a+(ITEMS[k]?ITEMS[k][3]*G.sel[k]:0),0)},
 cnt(){return Object.keys(G.sel).reduce((a,k)=>a+G.sel[k],0)},
 cur(){const t=G.tgt,tot=UP.total();if(t==null||!ITEMS[t]||!upTgtOK(t)||!tot)return null;return{tot,t,p:UPC.calc(tot,ITEMS[t][3])}},
 p(){const c=UP.cur();return c?c.p:0},
 // полная проверка перед запуском (владение, количество, цель, шанс)
 check(){const ids=Object.keys(G.sel);if(!ids.length)return{err:'Выберите предметы для ставки'};let tot=0,n=0;
  for(const k of ids){const id=+k,q=G.sel[k];if(!Number.isInteger(id)||!ITEMS[id]||!upStakeOK(id)||!Number.isInteger(q)||q<1||q>(S.col[id]|0))return{err:'Выбранных предметов нет в инвентаре'};tot+=ITEMS[id][3]*q;n+=q}
  const t=G.tgt;if(!Number.isInteger(t)||!ITEMS[t])return{err:'Выберите желаемый предмет'};if(!upTgtOK(t))return{err:'Этот предмет нельзя получить через UPGRADER'};
  const p=UPC.calc(tot,ITEMS[t][3]);if(p<UPC.MIN)return{err:'Шанс ниже '+pf(UPC.MIN)+' — увеличьте ставку'};
  return{ok:1,tot,n,t,p}},
 // ----- выбор (отдельные модальные окна) -----
 shut(){const e=document.getElementById('upm');if(e)e.remove();document.body.classList.remove('upmo')},
 open(k){if(G.ph||UP.lock||(k!='b'&&k!='t'))return;G.pk=k;
  if(k=='b'){G.dr={};for(const i in G.sel){const st=S.col[i]|0;if(ITEMS[i]&&st>0)G.dr[i]=Math.min(G.sel[i],st)}}
  UP.modal()},
 close(){G.pk='';G.dr=null;UP.modal()},
 // создаёт/обновляет/убирает модальное окно (оно живёт в <body>, поэтому не зависит от перерисовки #app)
 modal(){let e=document.getElementById('upm');
  if(game!='upgrader'||!G.pk){UP.shut();return}
  if(!e){e=document.createElement('div');e.id='upm';e.className='upm';e.onclick=ev=>{if(ev.target===e)UP.close()};document.body.appendChild(e)}
  document.body.classList.add('upmo');e.innerHTML=UP.pickUI()},
 dsum(){const d=G.dr||{};let t=0,n=0;for(const k in d){if(ITEMS[k]){t+=ITEMS[k][3]*d[k];n+=d[k]}}return{t,n}},
 pick(k,i){if(G.ph||UP.lock||!ITEMS[i])return;
  if(k=='b'){if(!G.dr)return;if(!upStakeOK(i)){toast('Этот предмет нельзя поставить в UPGRADER');return}if(G.dr[i])delete G.dr[i];else{if((S.col[i]|0)<1){toast('Этого предмета нет в инвентаре');return}G.dr[i]=1}UP.mrefresh()}
  else{if(!upTgtOK(i)){toast('Этот предмет нельзя получить через UPGRADER');return}G.tgt=i;G.pk='';G.dr=null;UP.modal();UP.refresh()}},
 dstep(i,d){if(G.ph||UP.lock||!G.dr||!G.dr[i])return;const q=G.dr[i]+d,st=S.col[i]|0;
  if(q<1)delete G.dr[i];else if(q>st){toast('Больше нет в инвентаре');return}else G.dr[i]=q;UP.mrefresh()},
 dclear(){if(!G.dr)return;G.dr={};UP.mrefresh()},
 confirm(){if(G.ph||UP.lock||!G.dr)return;const d={};
  for(const k in G.dr){const st=S.col[k]|0,q=Math.min(G.dr[k],st);if(ITEMS[k]&&q>0)d[k]=q}
  G.sel=d;G.pk='';G.dr=null;UP.modal();UP.refresh()},
 dec(i){if(G.ph||!G.sel[i])return;if(--G.sel[i]<=0)delete G.sel[i];UP.refresh()},
 rm(i){if(G.ph)return;delete G.sel[i];UP.refresh()},
 clear(){if(G.ph)return;G.sel={};UP.refresh()},
 fr(k,i){G.fr[k]=i;UP.mtools();UP.relist(1)},so(k,v){G.so[k]=v;UP.mtools();UP.relist(1)},
 mtools(){const e=document.getElementById('upmt');if(e)e.innerHTML=UP.tools(G.pk)},
 mfoot(){const e=document.getElementById('upmf');if(e)e.innerHTML=UP.foot()},
 relist(top){const e=document.getElementById('upml');if(e){const s=e.scrollTop;e.innerHTML=UP.list(G.pk);e.scrollTop=top?0:s}},
 mrefresh(){UP.relist();UP.mfoot()},
 refresh(){const set=(id,h)=>{const e=$(id);if(e)e.innerHTML=h};set('#upL',UP.left());set('#upR',UP.right());
  if(!G.ph){set('#upW',UP.wheel())}set('#upI',UP.info());set('#upB',UP.btn())},
 again(){if(UP.lock)return;UP.init();render()},
 // ----- запуск: вся экономическая часть выполняется синхронно в одном блоке и сразу сохраняется -----
 go(){if(UP.lock||G.ph){return}const v=UP.check();if(!v.ok){toast(v.err);return}
  UP.lock=true;const g=G,win=rnd()<v.p,items=Object.keys(g.sel).map(k=>[+k,g.sel[k]]);
  for(const[id,q]of items){S.col[id]-=q;if(S.col[id]<=0)delete S.col[id]}
  if(win)S.col[v.t]=(S.col[v.t]|0)+1;
  S.up.stat.n++;win?S.up.stat.w++:S.up.stat.l++;S.up.stat.spent+=v.n;
  S.up.hist.unshift({t:Date.now(),b:items,v:v.tot,g:v.t,p:v.p,w:win?1:0});S.up.hist=S.up.hist.slice(0,50);save();
  // позиция остановки: победа — внутри синего сектора (0..w°), иначе в красной части
  const w=v.p*360,th=win?w*(.08+rnd()*.84):w+(360-w)*(.06+rnd()*.88),R=(5+rndInt(3))*360-th;
  Object.assign(g,{ph:'spin',rot:R,dur:S.anim?5600:600,an:0,pk:'',res:{win,p:v.p,t:v.t,tot:v.tot,n:v.n}});
  SFX.play('caseopen');wTicks(R,24,g.dur,'upgrader');render();
  setTimeout(()=>UP.fin(g,win),g.dur+450)},
 fin(g,win){UP.lock=false;
  if(game=='upgrader'){if(G===g){g.ph='res';render()}else UP.refresh()}
  toast(win?'UPGRADE SUCCESS':'UPGRADE FAILED');SFX.play(win?(ITEMS[g.res.t][2]>=4?'jackpot':'win'):'lose');rec(win?1:-1,'upgrader')},
 // ----- отрисовка -----
 left(){const ids=Object.keys(G.sel).map(Number).sort((a,b)=>ITEMS[b][3]-ITEMS[a][3]),lk=!!G.ph||UP.lock;
  return`<h4><span>Ваши предметы</span><span>${UP.cnt()} шт.</span></h4>`+(ids.length?`<div class=srows>${ids.map(i=>{const it=ITEMS[i];return`<div class=srow style="--rc:${RC[it[2]]}"><span class=ui>${icon(i)}</span><span class=sn><b>${xe(it[0])}</b><em>${cn(it[3]*G.sel[i])}</em></span><span class=sq>×${G.sel[i]}</span><span class=sc2><button class=mini ${lk?'disabled':''} aria-label="Убрать один" onclick="UP.dec(${i})">${ico('minus',14)}</button><button class=mini ${lk?'disabled':''} aria-label="Убрать все" onclick="UP.rm(${i})">${ico('x',14)}</button></span></div>`}).join('')}</div><div class=tot><span>Итого</span>${cn(UP.total())}</div>`:`<div class=empty>${ico('plus',26)}<span>Выберите предметы из инвентаря</span></div>`)+`<button class=pbtn ${lk?'disabled':''} onclick="UP.open('b')">${ids.length?'Изменить ставку':'Выбрать предметы'}</button>`+(ids.length?`<button class="pbtn g" ${lk?'disabled':''} onclick="UP.clear()">Очистить</button>`:'')},
 right(){const t=G.tgt,lk=!!G.ph||UP.lock,r=t!=null?ITEMS[t][2]:0;
  return`<h4><span>Желаемый предмет</span></h4>`+(t==null?`<div class=empty>${ico('search',26)}<span>Любой предмет каталога игры</span></div>`:`<div class="tcard${r==6?' sp':''}" style="--rc:${RC[r]}"><span class=ti>${icon(t)}</span><b>${xe(ITEMS[t][0])}</b><em style="color:${RC[r]}">${RAR[r]}</em>${cn(ITEMS[t][3])}</div>`)+`<button class=pbtn ${lk?'disabled':''} onclick="UP.open('t')">${t==null?'Выбрать предмет':'Сменить предмет'}</button>`},
 wheel(){const p=G.ph&&G.res?G.res.p:UP.p(),W=p*100;
  return`<div class=whw><div class=whl id=whl><svg viewBox="0 0 300 300"><defs><filter id="upF" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="upD"><stop offset="0" stop-color="#0d1c40"/><stop offset="1" stop-color="#040815"/></radialGradient></defs>
<circle cx="150" cy="150" r="146" fill="#060b1e" stroke="#1e3a8a" stroke-width="2"/>
<circle cx="150" cy="150" r="106" fill="url(#upD)"/><circle cx="150" cy="150" r="112" fill="none" stroke="rgba(125,211,252,.35)" stroke-width="6" stroke-dasharray="1.4 9.7"/>
${p?`<circle cx="150" cy="150" r="128" fill="none" stroke="#ff3b57" stroke-width="26" opacity=".92"/><circle cx="150" cy="150" r="128" fill="none" stroke="#22d3ee" stroke-width="26" stroke-dasharray="${W} 100" pathLength="100" transform="rotate(-90 150 150)" filter="url(#upF)"/>`:`<circle cx="150" cy="150" r="128" fill="none" stroke="#334155" stroke-width="26"/>`}
<circle cx="150" cy="150" r="141" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5"/></svg></div>
<svg class=wptr viewBox="0 0 300 300"><polygon points="150,40 136,2 164,2" fill="#fbbf24" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
<div class="whc up"><b>${p?pf(p):'—'}</b><span>шанс</span></div></div>`},
 info(){const g=G;
  if(g.ph=='res'&&g.res){const r=g.res,it=ITEMS[r.t];
   return r.win?`<div class="rsl ok">${fxp('#22d3ee',20)}<div class=rsb>UPGRADE SUCCESS</div><div class=rit>${icon(r.t)}</div><b>${xe(it[0])}</b><div class=mu style="color:#9fd8ff">Добавлено в инвентарь · шанс был ${pf(r.p)}</div></div>`

  const c=UP.cur(),tv=c?ITEMS[c.t][3]:0;

 btn(){const g=G;if(g.ph=='res')return`<button class=upgo onclick="UP.again()">${ico('spin',20)}НОВАЯ ПОПЫТКА</button>`;
  if(g.ph=='spin'||UP.lock)return`<button class="upgo busy" disabled>${ico('spin',20)}ВРАЩЕНИЕ</button>`;

 list(k){const q=(G.q[k]||'').trim().toLowerCase(),fr=G.fr[k],so=G.so[k],dr=G.dr||{};
  let ids=k=='b'?Object.keys(S.col).map(Number).filter(i=>ITEMS[i]&&S.col[i]>0&&upStakeOK(i)):ITEMS.map((_,i)=>i).filter(upTgtOK);
  ids=ids.filter(i=>(fr<0||ITEMS[i][2]==fr)&&(!q||ITEMS[i][0].toLowerCase().includes(q)));
  ids.sort(so=='a'?(a,b)=>ITEMS[a][3]-ITEMS[b][3]||a-b:(a,b)=>ITEMS[b][3]-ITEMS[a][3]||a-b);
  if(!ids.length)return`<p class=mu style="text-align:center;padding:24px 4px">${k=='b'&&!Object.keys(S.col).length?'В инвентаре пока нет предметов. Откройте кейс в разделе «Игры».':'Ничего не найдено'}</p>`;
  return`<div class=upg>${ids.map(i=>{const it=ITEMS[i],rc=RC[it[2]];
   if(k=='b'){const st=S.col[i]|0,sel=dr[i]|0,on=sel>0;
    return`<div class="uc2 r${it[2]}${on?' on':''}" role=button tabindex=0 aria-pressed="${on}" style="--rc:${rc}" onclick="UP.pick('b',${i})">${on?'<span class=ck>'+sv('check',11)+'</span>':''}<span class=ui>${icon(i)}</span><b class=nm>${xe(it[0])}</b><em style="color:${rc}">${RAR[it[2]]}</em>${cn(it[3])}<span class=qa>${on&&st>1?`<button class=mini aria-label="Меньше" onclick="event.stopPropagation();UP.dstep(${i},-1)">${ico('minus',12)}</button><span class=qv>${sel}/${st}</span><button class=mini aria-label="Больше" ${sel>=st?'disabled':''} onclick="event.stopPropagation();UP.dstep(${i},1)">${ico('plus',12)}</button>`:on?'Выбрано':'В наличии ×'+st}</span></div>`}
   const on=G.tgt===i;
   return`<div class="uc2 r${it[2]}${on?' on':''}" role=button tabindex=0 aria-pressed="${on}" style="--rc:${rc}" onclick="UP.pick('t',${i})">${on?'<span class=ck>'+sv('check',11)+'</span>':''}<span class=ui>${icon(i)}</span><b class=nm>${xe(it[0])}</b><em style="color:${rc}">${RAR[it[2]]}</em>${cn(it[3])}</div>`}).join('')}</div>`},
 tools(k){const so=G.so[k],fr=G.fr[k];
  return`<div class=srch>${ico('search',16)}<input id=upq class=sin type=search enterkeyhint=search placeholder="Поиск по названию" value="${xe(G.q[k])}" oninput="G.q['${k}']=this.value;UP.relist(1)" autocomplete=off></div>
<div class=umf>${[-1,...RAR.map((_,i)=>i).filter(i=>i!==RSEC)].map(i=>`<button class="fc ${fr==i?'on':''}" style="--rc:${i<0?'#94a3b8':RC[i]}" onclick="UP.fr('${k}',${i})"><i class=dot></i><span>${i<0?'Все':RAR[i]}</span></button>`).join('')}</div>
<div class=ums>${SRTL.map(s=>`<button class="fc so ${so==s[0]?'on':''}" onclick="UP.so('${k}','${s[0]}')">${s[1]}</button>`).join('')}</div>`},
 foot(){const d=UP.dsum();return`<div class=tot><span>Выбрано: <b>${d.n}</b> шт.</span><span>Итого ${cn(d.t)}</span></div><div class=umb><button class="pbtn g" ${d.n?'':'disabled'} onclick="UP.dclear()">Очистить</button><button class=pbtn onclick="UP.confirm()">Подтвердить выбор</button></div>`},
 pickUI(){const k=G.pk;if(!k)return'';const b=k=='b';
  return`<div class=upm-b role=dialog aria-modal=true><div class=upm-h><b>${b?'ВЫБЕРИТЕ ПРЕДМЕТЫ ДЛЯ СТАВКИ':'ВЫБЕРИТЕ ЖЕЛАЕМЫЙ ПРЕДМЕТ'}</b><button class=upm-x aria-label="Закрыть" onclick="UP.close()">${ico('x',18)}</button></div><div class=upm-t id=upmt>${UP.tools(k)}</div><div class=upm-l id=upml>${UP.list(k)}</div>${b?`<div class=upm-f id=upmf>${UP.foot()}</div>`:''}</div>`},
 hist(){const st=S.up.stat,h=S.up.hist,sh=G.hall?h:h.slice(0,10);
  return`<h2>История UPGRADER</h2><div class=stg>${[['Всего попыток',st.n],['Побед',st.w],['Поражений',st.l],['Предметов потрачено',st.spent]].map(([a,b])=>`<div><b>${fmt(b)}</b><span>${a}</span></div>`).join('')}</div>`+
  (sh.length?sh.map(r=>`<div class="hrow ${r.w?'ok':'bad'}"><div class=hr1><span>${dt(r.t)}</span><b>${r.w?'УСПЕХ':'ПРОВАЛ'}</b></div><div class=hr2>${r.b.map(([i,q])=>xe(ITEMS[i]?ITEMS[i][0]:'?')+' ×'+q).join(', ')}</div><div class=hr3><span>Ставка ${cn(r.v)}</span><span>Цель: ${xe(ITEMS[r.g]?ITEMS[r.g][0]:'?')}</span><span>Шанс ${pf(r.p)}</span></div></div>`).join('')+(!G.hall&&h.length>10?`<button class="btn g" onclick="G.hall=1;render()">Показать всю историю (${h.length})</button>`:''):'<p class=mu>Попыток пока не было.</p>')},
 view(){return bar('UPGRADER')+`<div class=upz><div class=upt>UPGRADER</div><div class=upp><div class=pnl id=upL>${UP.left()}</div><div class=pnl id=upR>${UP.right()}</div></div><div id=upW>${UP.wheel()}</div><div id=upI>${UP.info()}</div><div id=upB>${UP.btn()}</div></div>${UP.hist()}`}};

// =====================================================================
// ОСОБЫЙ КЕЙС — колесо фортуны, 14 одинаковых секторов (9 прежних + 5 новых)
// =====================================================================
const SPT={100000:[1,8],200000:[2,7],300000:[3,6],400000:[4,5],500000:[5,4]},SPMIN=100000,SPMAX=500000,SPN=14,SPR=9,SPWS={1:2,2:3,3:5,4:6,5:8},SPA=360/SPN;
// SPR=9 — прежняя база шансов (w/9), она НЕ менялась: исход определяется как раньше, rndInt(9)<w. SPN=14 — число секторов на колесе: 9 прежних (позиции и содержимое сохранены) + 5 новых.
const spPct=w=>(w/SPR*100).toFixed(2).replace('.',',')+'%';
const SP={lock:false,
 init(){G={bet:100000,ph:null,rot:0,res:null,hall:0}},
 pos(w){const x=SPWS[w]-w;return Array.from({length:SPN},(_,i)=>i<SPR?Math.floor((i+1)*w/SPR)>Math.floor(i*w/SPR):Math.floor((i-SPR+1)*x/5)>Math.floor((i-SPR)*x/5))},
 setBet(b){if(G.ph=='spin'||SP.lock)return;if(!SPT[b]||b<SPMIN||b>SPMAX){toast('Ошибка: недопустимая ставка');return}G.bet=b;G.ph=null;G.res=null;G.rot=0;render()},
 wheel(){const w=SPT[G.bet][0],pr=SP.pos(w),pt=(r,a)=>[(150+r*Math.sin(a*Math.PI/180)).toFixed(2),(150-r*Math.cos(a*Math.PI/180)).toFixed(2)];let s='',ic='',bl='';
  for(let i=0;i<SPN;i++){const a0=i*SPA,a1=a0+SPA,p0=pt(134,a0),p1=pt(134,a1),am=a0+SPA/2,c=pt(101,am);
   s+=`<path d="M150 150L${p0[0]} ${p0[1]}A134 134 0 0 1 ${p1[0]} ${p1[1]}Z" fill="url(#${pr[i]?'spW':'spL'})" stroke="${pr[i]?'#b6ff9e':'#3a1a24'}" stroke-width="${pr[i]?2:1.5}"/>`;
   ic+=pr[i]?admMini(c[0]*1,c[1]*1,am,.72):lossSym(+c[0],+c[1],am,.95)}
  for(let i=0;i<28;i++){const q=pt(142,i*360/28);bl+=`<circle cx="${q[0]}" cy="${q[1]}" r="2.4" fill="${i%2?'#b6ff9e':'#39ff14'}"/>`}
  return`<div class=whw><div class=whl id=whl><svg viewBox="0 0 300 300"><defs><filter id="spF" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="spW" cx=".5" cy=".5" r=".75"><stop offset=".25" stop-color="#0c8a2e"/><stop offset="1" stop-color="#27e84a"/></radialGradient><radialGradient id="spL" cx=".5" cy=".5" r=".75"><stop offset=".2" stop-color="#10131c"/><stop offset="1" stop-color="#262c3d"/></radialGradient></defs>
<circle cx="150" cy="150" r="148" fill="#031009" stroke="#39ff14" stroke-width="2" filter="url(#spF)"/><circle cx="150" cy="150" r="141" fill="#04150b" stroke="#1b5c2a" stroke-width="5"/>${bl}${s}${ic}</svg></div>
<svg class=wptr viewBox="0 0 300 300"><polygon points="150,42 135,2 165,2" fill="#39ff14" stroke="#eaffe0" stroke-width="1.5" stroke-linejoin="round"/></svg>
<div class="whc hub">${admIcon()}</div></div>`},
 stat(){const b=G.bet,[w,l]=SPT[b];return`<div class=spinfo><div><span>Ставка</span>${cn(b)}</div><div><span>Шанс победы</span><b style="color:#8dff6b">${spPct(w)}</b></div><div><span>Призовых секторов</span><b style="color:#8dff6b">${SPWS[w]}</b></div><div><span>Проигрышных</span><b style="color:#ff7a8c">${SPN-SPWS[w]}</b></div></div>`},
 resHtml(){const r=G.res;if(G.ph!='res'||!r)return'';
  return r.win?`<div class="rsl spw">${fxp('#39ff14',26)}<div class=rsb>SPECIAL WIN</div><div class="rit spz2" style="width:130px">${icon(ADM)}</div><b>Талисман Админа</b><div class=mu style="color:#9fd8a0">Добавлен в инвентарь</div></div>`
   :`<div class="rsl bad"><div class=rsb>BET LOST</div><div class=mu style="color:#ffb3bf;margin-top:6px">Ставка ${fmt(r.bet)} монет потеряна</div></div>`},
 btn(){const lk=G.ph=='spin'||SP.lock,can=S.coins>=G.bet;
  if(lk)return`<button class="spgo busy" disabled>${ico('spin',20)}ВРАЩЕНИЕ</button>`;
  return(can?'':`<div class=hint>Недостаточно монет: нужно ${fmt(G.bet)}</div>`)+`<button class=spgo ${can?'':'disabled'} onclick="SP.go()">${ico('spin',20)}КРУТИТЬ</button>`},
 go(){if(SP.lock||G.ph=='spin')return;const bet=G.bet,t=SPT[bet];
  if(!t||bet<SPMIN||bet>SPMAX||t[0]+t[1]!==SPR){toast('Ошибка: недопустимая ставка');return}
  if(S.coins<bet){toast('Недостаточно монет');SP.refresh();return}
  SP.lock=true;if(!E.spend(bet)){SP.lock=false;return}
  const g=G,w=t[0],pr=SP.pos(w),win=rndInt(SPR)<w,pool=pr.map((v,i)=>v==win?i:-1).filter(i=>i>=0),sec=pool[rndInt(pool.length)];
  if(win)S.col[ADM]=(S.col[ADM]|0)+1;
  S.sp.stat.n++;S.sp.stat.bet+=bet;win?(S.sp.stat.w++,S.sp.stat.tal++):S.sp.stat.l++;
  S.sp.hist.unshift({t:Date.now(),b:bet,w:w,p:w/SPR,r:win?1:0,i:win?ADM:null});S.sp.hist=S.sp.hist.slice(0,50);save();
  const th=sec*SPA+SPA/2+(rnd()*2-1)*(SPA*.325),R=(5+rndInt(3))*360-th;
  Object.assign(g,{ph:'spin',rot:R,dur:S.anim?6200:600,an:0,res:{win,bet}});SFX.play('caseopen');wTicks(R,SPA,g.dur,'special');render();
  setTimeout(()=>SP.fin(g,win),g.dur+450)},
 fin(g,win){SP.lock=false;if(game=='special'){if(G===g){g.ph='res';render()}else SP.refresh()}
  toast(win?'SPECIAL WIN':'BET LOST');SFX.play(win?'sp':'lose');rec(win?1:-1,'special')},
 refresh(){const e=$('#spB');if(e)e.innerHTML=SP.btn()},
 hist(){const st=S.sp.stat,h=S.sp.hist,sh=G.hall?h:h.slice(0,10);
  return`<h2>История ОСОБОГО КЕЙСА</h2><div class=stg>${[['Открытий',st.n],['Поставлено монет',st.bet],['Побед',st.w],['Поражений',st.l],['Талисманов Админа',st.tal]].map(([a,b])=>`<div><b>${fmt(b)}</b><span>${a}</span></div>`).join('')}</div>`+
  (sh.length?sh.map(r=>`<div class="hrow ${r.r?'spw':'bad'}"><div class=hr1><span>${dt(r.t)}</span><b>${r.r?'ПОБЕДА':'ПРОИГРЫШ'}</b></div><div class=hr3><span>Ставка ${cn(r.b)}</span><span>Призовых: ${SPWS[r.w]||r.w} из ${SPN}</span><span>Шанс ${pf(r.p)}</span></div>${r.r?'<div class=hr2>Получено: Талисман Админа</div>':''}</div>`).join('')+(!G.hall&&h.length>10?`<button class="btn g" onclick="G.hall=1;render()">Показать всю историю (${h.length})</button>`:''):'<p class=mu>Ставок пока не было.</p>')},
 view(){const lk=G.ph=='spin'||SP.lock;
  return bar('ОСОБЫЙ КЕЙС')+`<div class=spz>${spk()}<div class=spt2>ОСОБЫЙ КЕЙС</div><div class=spbal><span>Баланс ${cn(S.coins)}</span><span>Текущая ставка ${cn(G.bet)}</span></div>${SP.wheel()}
<div class=bets>${Object.keys(SPT).map(Number).map(b=>`<button class="bt ${G.bet==b?'on':''}" ${lk?'disabled':''} onclick="SP.setBet(${b})">${fmt(b)}</button>`).join('')}</div>${SP.stat()}${SP.resHtml()}<div id=spB>${SP.btn()}</div></div>${SP.hist()}`}};

// баннер в разделе «Кейсы» (вход в ОСОБЫЙ КЕЙС; обычные кейсы не затронуты)
const spBanner=()=>{const ws=Object.values(SPT).map(v=>v[0]),lo=Math.min(...ws),hi=Math.max(...ws);
return`<div class="ct spc">${spk()}<div class=rw><div class=spci>${admIcon()}</div><div><span class=spct>ОСОБЫЙ КЕЙС</span><div class=spcs>Колесо фортуны · <span style="white-space:nowrap">ставка 100 000–500 000</span></div></div></div><div class=od><div><span>Приз</span><b>Талисман Админа</b></div><div><span>Шанс победы</span><b>${spPct(lo)} – ${spPct(hi)}</b></div></div><button class="btn spcb" onclick="openG('special')">Открыть колесо</button></div>`};

// регистрация в списке игр (плитки на главной и в «Играх» строятся из GM)
GM.push(['upgrader','UPGRADER','Апгрейд предметов',UP,'#0891b2','#4f46e5','<circle cx="20" cy="22" r="13" fill="none" stroke="#fff" stroke-width="3" opacity=".55"/><path d="M20 31V13M12 21l8-8 8 8" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>','Поставьте любые предметы из инвентаря и выберите желаемый предмет каталога. Шанс = стоимость ставки ÷ стоимость цели (до 95%, 100% недостижим). Талисманы Админа и Разработчика получить через UPGRADER нельзя. Синяя зона колеса — победа, красная — проигрыш. Поставленные предметы расходуются в любом случае.']);
GM.push(['special','ОСОБЫЙ КЕЙС','Колесо фортуны',SP,'#16a34a','#052e16',`<polygon points="${starPts(20,21,16,7.6)}" fill="#fff"/><path d="M23.4 17.4A5 5 0 1 0 23.4 24.6" fill="none" stroke="#052e16" stroke-width="3" stroke-linecap="round"/>`,'Ставка 100 000–500 000 монет. На колесе 14 равных секторов: призовых — 2 при ставке 100 000, 3 — при 200 000, 5 — при 300 000, 6 — при 400 000, 8 — при 500 000. Шанс победы остался прежним: 11,11% — 22,22% — 33,33% — 44,44% — 55,56%. Приз — Талисман Админа (редкость ОСОБЫЙ). Исход определяется до анимации, колесо лишь показывает результат.']);

CFG.xp.upgrader={p:6};CFG.xp.special={p:8};
{const _r3=render;render=function(){_r3();UP.modal()}}

render();
</script></body></html>
